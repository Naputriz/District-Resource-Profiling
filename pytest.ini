[pytest]
pythonpath = .
markers =
    unit: pure unit tests with no external DB or LLM dependencies
    db: integration tests requiring PostGIS database
    system: end-to-end system tests (real HTTP server or Playwright UI)
    llm: end-to-end tests requiring live Ollama LLM
testpaths =
    backend/tests/unit
    backend/tests/integration
    backend/tests/system
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
